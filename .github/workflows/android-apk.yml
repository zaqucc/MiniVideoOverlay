name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and capture complete log
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee build-debug.log
          result=${PIPESTATUS[0]}
          echo "$result" > build-exit-code.txt
          exit "$result"

      - name: Upload complete build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniVideoOverlay-build-diagnostic-log
          path: |
            build-debug.log
            build-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniVideoOverlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
